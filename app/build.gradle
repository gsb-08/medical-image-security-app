plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.example.imagesecure"
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName "1.0.5"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures { viewBinding true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.firebase:firebase-auth:21.0.3'
    implementation 'com.google.firebase:firebase-database:20.0.4'
    implementation 'com.google.firebase:firebase-storage:20.0.1'
    implementation 'com.google.mlkit:image-labeling:17.0.7'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    //for getting json data
    implementation 'com.android.volley:volley:1.2.1'
    //location - lat, lon
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    //custom toast
    implementation 'com.github.dev-aniketj:roasted-toast:1.0.2'
    //custom progress
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'
    //swipe refresh
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    //App Auto Update Feature
    implementation 'com.google.android.play:core:1.10.3'
    //For Responsive screen size
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
    //Lotti files
    implementation 'com.airbnb.android:lottie:5.2.0'
    // Multi Dex Enable
    implementation 'androidx.multidex:multidex:2.0.1'

    // HTTP + JSON
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    //Custom Toasts
    implementation 'com.pranavpandey.android:dynamic-toasts:4.1.0'

    implementation 'de.hdodenhof:circleimageview:3.0.0'

    implementation("com.google.ai.client.generativeai:generativeai:0.7.0")

    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // --- TensorFlow Lite (for your custom .tflite model) ---
    implementation 'org.tensorflow:tensorflow-lite:2.12.0'          // Core TFLite runtime
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.12.0'       // Optional: GPU delegate
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'    // Image utils, TensorImage, etc.
    implementation 'org.tensorflow:tensorflow-lite-metadata:0.4.4'   // If you read model metadata



// (Recommended if you’ll use object detection / Task API)
// implementation 'org.tensorflow:tensorflow-lite-task-vision:0.4.4'

// (Optional only if you plan to deliver the model via Firebase Model Downloader)
// implementation "com.google.android.gms:play-services-mlkit-modeldownloader:16.0.0"

}